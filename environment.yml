name: mj
channels:
  - conda-forge

dependencies:
  - python=3.12

  # 동역학·기구학
  - pinocchio=4.0.0

  # QP 솔버 (conda는 OSQP만, proxsuite은 PyPI)
  - osqp

  # symbolic / NLP (humanoid centroidal MPC, manipulator MPC, casADi 테스트)
  - casadi=3.7.2

  # 수치 / 플롯
  - numpy
  - scipy
  - matplotlib

  # Jupyter
  - jupyter
  - ipykernel

  # PyPI 전용
  - pip
  - pip:
      - mujoco==3.8.0   # 시뮬레이션 — conda-forge 빌드보다 PyPI가 빨라 PyPI 사용
      - proxsuite       # dense/sparse QP, INRIA. quadruped MPC 백엔드
