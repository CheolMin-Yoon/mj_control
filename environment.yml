name: mj
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12

  # 시뮬 / 동역학
  - pinocchio=4.0.0

  # QP / Convex optimization
  - osqp
  - casadi=3.7.2

  # 수치 / 플롯
  - numpy
  - scipy
  - matplotlib

  # Jupyter
  - jupyter
  - ipykernel
  - nbformat
  - nbconvert
  - nbstripout

  # PyPI 전용
  - pip
  - pip:
      - mujoco==3.8.0
      - mujoco-mjx[warp]==3.8.0

      # 추가 백엔드
      #- newton[examples]==1.1.0  # NVIDIA Newton (Warp 기반 differentiable physics)

      # 추후 추가
      # - --extra-index-url https://download.pytorch.org/whl/cu128
      # - torch
      # - torchvision
      # https://github.com/edxmorgan/casadi-on-gpu
