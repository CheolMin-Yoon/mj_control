name: mj
channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.12

  # 시뮬 / 동역학
  - pinocchio=4.0.0
  - mujoco

  # QP / Convex optimization
  - proxsuite               # ProxQP (proximal QP)
  - osqp                    # ADMM-for-QP 레퍼런스
  - cvxpy                   # SOCP/SDP/LASSO 프로토타이핑
  - casadi

  # 수치 / 플롯
  - numpy
  - scipy
  - matplotlib

  # Jupyter
  - jupyter
  - ipykernel
  - nbformat
  - nbconvert

  # PyPI 전용
  - pip
  - pip:
      - newton[examples]
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch
      - torchvision
