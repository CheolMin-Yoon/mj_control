[project]
name = "mj-control"
version = "0.1.0"
description = "MuJoCo + Pinocchio fixed-base control: cartpole, manipulator, RB-Y1 dual-arm impedance"
requires-python = ">=3.14,<3.15"
dependencies = [
    "mujoco>=4.0.0",
    "pin==4.1.0",
    "osqp>=1.1.3",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["ruff"]
# CasADi CUDA codegen 포크 + Pinocchio CasADi 바인딩, 빌드 레시피는 CheolMin-Yoon/casadi MJ_CONTROL_CASADI.md
codegen = ["casadi==3.8.2.post0+cuda.ccc4fd091", "pinocchio-casadi==4.1.0+caccc4fd091"]

[tool.uv]
package = false
default-groups = ["dev", "codegen"]

[tool.uv.sources]
casadi = { path = "/home/frlab/.local/share/mj-control-casadi/wheels/casadi-3.8.2.post0+cuda.ccc4fd091-cp314-cp314-linux_x86_64.whl" }
pinocchio-casadi = { path = "/home/frlab/.local/share/mj-control-casadi/wheels/pinocchio_casadi-4.1.0+caccc4fd091-cp314-cp314-linux_x86_64.whl" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "UP"]
# 수식 기호 인자·지역 변수(A, B, M, J, Lambda) 허용
ignore = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["source"]
